name: expert_inspection
description: 专家现场工作辅助系统 - Flutter客户端

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # 状态管理
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # 网络请求
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # 数据存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 路由
  go_router: ^13.0.1
  
  # UI组件
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  
  # 图片选择
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  
  # 位置服务
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # 工具
  intl: ^0.18.1
  logger: ^2.0.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # 本地通知
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # 代码生成
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  retrofit_generator: ^8.0.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
