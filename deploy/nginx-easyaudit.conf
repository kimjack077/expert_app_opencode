# EasyAudit Nginx Configuration
# Web Admin (Port 3000) & H5 App (Port 5173)

# -------------------------------------------------------------
# 1. Web Admin (PC端管理后台) - 端口 3000
# -------------------------------------------------------------
server {
    listen 3000;
    server_name _;

    root /home/ubuntu/expert_app/web-admin/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip 高效压缩传输
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. 静态哈希资源（JS、CSS、图片、字体）：配置 1 年强缓存，开启 immutable
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. HTML 入口与 SPA 根路由：免缓存，保证秒级获得最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 3. 同源 API 反向代理至后端 (127.0.0.1:8000)
    # 同源部署彻底消除 CORS 跨域 OPTIONS 探测预检，网络往返直接减半
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    # 4. 上传附件静态文件代理
    location /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# -------------------------------------------------------------
# 2. H5 App (移动现场检查端) - 端口 5173
# -------------------------------------------------------------
server {
    listen 5173;
    server_name _;

    root /home/ubuntu/expert_app/h5-app/dist;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 静态哈希资源 1 年强缓存
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
