# EasyAudit Nginx Configuration
# Web Admin (Port 3000) & H5 App (Port 5173)

# -------------------------------------------------------------
# 1. Web Admin (PC端管理后台) - 端口 3000
# -------------------------------------------------------------
server {
    listen 3000;
    server_name _;

    root /home/ubuntu/expert_app/web-admin/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip 高效压缩传输
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. 上传附件静态文件代理（必须使用 ^~ 前缀匹配，阻止后续静态哈希正则拦截）
    location ^~ /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. 同源 API 反向代理至后端 (127.0.0.1:8000)
    location ^~ /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    # 3. 静态哈希资源（JS、CSS、图片、字体）：配置 1 年强缓存，开启 immutable
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 4. HTML 入口与 SPA 根路由：免缓存，保证秒级获得最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------
# 2. H5 App (移动现场检查端) - 端口 5173
#
# ⚠️ H5 用 vite `base: '/h5/'` 构建，dist/index.html 里引用的是
#    /h5/assets/*.js|css，而静态文件实际位于 dist/assets/。
#    因此必须把 /h5/ 前缀映射回 dist 根，否则首屏 JS/CSS 全部 404 → 整站白屏。
#    历史上本块 root 直接指向 dist 且没有 /h5/ 映射，正是白屏根因；
#    又因为下面那条静态哈希正则（try_files $uri =404）优先级高于普通前缀匹配，
#    /h5/assets/*.js 会被判 404，所以必须用 ^~ 抢占。
# -------------------------------------------------------------
server {
    listen 5173;
    server_name _;

    root /home/ubuntu/expert_app/h5-app/dist;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. 上传附件静态文件代理（必须使用 ^~ 前缀匹配，阻止后续静态哈希正则拦截）
    location ^~ /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. 同源 API 反向代理至后端 (127.0.0.1:8000)
    location ^~ /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    # 3a. /h5/assets/* → dist/assets/*，保留 1 年强缓存
    #     必须比下面的 /h5/ 更具体，nginx 取最长前缀匹配。
    location ^~ /h5/assets/ {
        rewrite ^/h5/assets/(.*)$ /assets/$1 break;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3b. H5 应用入口与 SPA 路由 → dist 根
    #     /h5/ → dist/index.html；/h5/login 等前端路由回落 index.html
    location ^~ /h5/ {
        rewrite ^/h5/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 4. 静态哈希资源 1 年强缓存（Web 端 / 根路径资源）
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. HTML 入口与 SPA 根路由：免缓存，保证秒级获得最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 6. 兼容旧链接：根路径直接落到 H5 应用
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
