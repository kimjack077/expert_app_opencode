[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config

markers =
    contract: 契约与一致性静态检查（无需数据库，随时可跑）
    unit: 纯函数单元测试（无需数据库，随时可跑）
    api: 接口层测试（需要 EFIS_TEST_DATABASE_URL 指向隔离测试库）
    report: 报表与统计对账测试（需要隔离测试库）
    e2e: 端到端测试（需要前后端服务在跑）
    slow: 耗时用例

# 分层执行示例：
#   pytest -m "contract or unit"        # 秒级，提交前门禁
#   pytest -m "api or report"           # 需要隔离测试库
#   pytest -m "not slow"                # 排除慢用例
